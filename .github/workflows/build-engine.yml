name: Build native Zelda web engine
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['native/**', 'scripts/patch-engine.py', '.github/workflows/build-engine.yml']
permissions:
  contents: read
concurrency:
  group: native-engine
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: zalo/Shipwright
          ref: f81ff64afdd8e0489237bd03c6b026582f6dc70d
          submodules: recursive
          path: upstream
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libglew-dev libsdl2-dev libz-dev zip pkg-config
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
          actions-cache-folder: emsdk-cache
      - name: Pin SDK path
        run: |
          EXPECTED="$GITHUB_WORKSPACE/emsdk-cache/emsdk-main"
          echo "EMSDK=$EXPECTED" >> "$GITHUB_ENV"
          echo "$EXPECTED" >> "$GITHUB_PATH"
          echo "$EXPECTED/upstream/emscripten" >> "$GITHUB_PATH"
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            upstream/build-web
            emsdk-cache/emsdk-main/upstream/emscripten/cache
          key: zelda-f81ff64-${{ github.sha }}
          restore-keys: |
            zelda-f81ff64-86e803f0169449c971d3286d720505d7001c7045
            zelda-f81ff64-
      - name: Capture cached compile commands
        run: |
          if [ -f upstream/build-web/build.ninja ]; then
            ninja -C upstream/build-web -t commands soh > compile-before.txt
          else
            touch compile-before.txt
          fi
      - run: python3 scripts/patch-engine.py upstream
      - name: Configure engine
        working-directory: upstream
        run: emcmake cmake -B build-web -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DSPDLOG_BUILD_SHARED=OFF
      - name: Preserve pinned source and dependency timestamps
        run: |
          REF=$(find upstream/build-web -name '*.o' -printf '%T@ %p\n' | sort -n | head -1 | cut -d' ' -f2)
          if [ -n "$REF" ]; then
            REF=$(realpath "$REF")
            git -C upstream ls-files -z | (cd upstream && xargs -0 touch -r "$REF")
            export ZELDA_CACHE_REFERENCE="$REF"
            git -C upstream submodule foreach --recursive 'git ls-files -z | xargs -0 touch -r "$ZELDA_CACHE_REFERENCE"'
            find upstream/build-web/_deps -type f -newer "$REF" -exec touch -r "$REF" {} +
            # setup-emsdk refreshes Clang's builtin header timestamps even at
            # the same pinned SDK version, invalidating every cached object.
            find "$EMSDK/upstream/lib/clang" -type f -newer "$REF" -exec touch -r "$REF" {} +
            # Our injected source remains newer and must compile on every build.
            touch upstream/soh/soh/web/together.cpp
          fi
      - name: Inspect incremental build plan
        run: |
          ninja -C upstream/build-web -t commands soh > compile-after.txt
          ninja -C upstream/build-web -n -d explain soh > build-plan.txt 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: native-build-plan
          path: |
            build-plan.txt
            compile-before.txt
            compile-after.txt
          retention-days: 2
      - name: Compile native game
        working-directory: upstream
        run: emmake cmake --build build-web --target soh --parallel 2
      - uses: actions/cache/save@v4
        if: always() && steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: |
            upstream/build-web
            emsdk-cache/emsdk-main/upstream/emscripten/cache
          key: zelda-f81ff64-${{ github.sha }}
      - name: Package engine
        run: |
          mkdir -p engine
          cp upstream/build-web/soh/soh.js upstream/build-web/soh/soh.wasm upstream/build-web/soh/soh.data engine/
          cp upstream/build-web/soh/soh.html engine/upstream.html
          cp upstream/soh/soh/web/soh.o2r engine/
          echo '${{ github.sha }}' > engine/build-commit.txt
          python3 - <<'PY'
          from pathlib import Path
          root = Path('upstream')
          notices = []
          for path in sorted(root.rglob('*')):
              if path.is_file() and path.name.upper().startswith(('LICENSE', 'COPYING')) and '.git' not in path.parts:
                  notices.append('\n\n--- ' + str(path.relative_to(root)) + ' ---\n' + path.read_text(errors='replace'))
          Path('engine/library-notices.txt').write_text('Pinned engine and dependency license notices\n' + ''.join(notices))
          controllers = list(root.rglob('gamecontrollerdb.txt'))
          if controllers:
              Path('engine/gamecontrollerdb.txt').write_bytes(controllers[0].read_bytes())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zelda-engine
          path: engine
          retention-days: 14
